# userpatches/config-rk3128.conf
# 新版 Armbian 构建配置 —— 替代已弃用的 lib.config
# 用法（在 userpatches/ 目录同级执行）:
#   ./compile.sh build rk3128
# 说明: BOARD / BRANCH / RELEASE 等仍由 GitHub Actions 工作流的 env 注入，
#       本文件只接手源加速与非官方板型开关。

# ===== 国内源加速配置（新版 Armbian 编译必备）=====
APT_MIRROR='http://mirrors.tuna.tsinghua.edu.cn/debian/'
APT_SECURITY_MIRROR='http://mirrors.tuna.tsinghua.edu.cn/debian-security/'
GITHUB_MIRROR='https://mirrors.ustc.edu.cn/github-release/'
KERNEL_MIRROR='https://mirrors.ustc.edu.cn/linux-kernel/'

# ===== 允许编译非官方支持的板型（RK3128 必备）=====
ALLOW_UNSUPPORTED_BOARD=yes
