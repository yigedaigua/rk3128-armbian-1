name: RK3128-Armbian-Printer-Server
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取官方稳定仓库(无阉割，RK3128兼容板型完整)
        run: git clone --depth=1 https://github.com/armbian/build.git build

      - name: 阿里云源+安装全套编译依赖(原生编译必备，无缺失)
        run: sudo sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list && sudo sed -i 's/security.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list && sudo apt-get update -y && sudo apt-get install -y git curl wget build-essential libssl-dev libffi-dev python3 python3-pip unzip bzip2 dosfstools parted gcc-arm-linux-gnueabihf device-tree-compiler bc flex bison libncurses5-dev binfmt-support qemu-user-static

      - name: 写入新版配置(替代已弃用的 lib.config)
        run: |
          cd build
          mkdir -p userpatches
          cat > userpatches/config-rk3128.conf <<'EOF'
          APT_MIRROR='http://mirrors.tuna.tsinghua.edu.cn/debian/'
          APT_SECURITY_MIRROR='http://mirrors.tuna.tsinghua.edu.cn/debian-security/'
          SKIP_QEMU_SETUP=yes
          SKIP_BOARD_CHECK=yes
          ALLOW_UNSUPPORTED_BOARD=yes
          NO_APT_CLEAN=yes
          BOARD=nanopineo2
          BRANCH=legacy
          RELEASE=bullseye
          ARCH=armhf
          KERNEL_CONFIGURE=no
          BUILD_MINIMAL=no
          BUILD_DESKTOP=no
          PACKAGES_ADD="cups cups-client cups-filters printer-driver-gutenprint printer-driver-all usbutils avahi-daemon libcups2-dev"
          SERVICES_TO_ENABLE="cups cups-browsed avahi-daemon"
          MODULES="g_serial cdc_acm usbcore usbhid ehci-hcd ohci-hcd r8152 mt7601u mac80211 cfg80211"
          EOF

      - name: 核心编译命令(改用新版 config 调用方式，使用 Docker)
        run: cd build && ./compile.sh build rk3128

      - name: 上传固件镜像(纯英文合规文件名，100%可下载)
        uses: actions/upload-artifact@v4
        with:
          name: RK3128-Armbian-32bit-Printer-Server-Final
          path: build/output/images/*.img
